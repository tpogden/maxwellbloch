name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra test --extra plot
      - name: Lint with ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Test with pytest
        run: uv run pytest -n auto

  test-jax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest and highest supported Python, so the lowest and highest JAX /
        # diffrax that the `jax` extra allows are both exercised.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra test --extra jax
      - name: Test the autodiff backend
        run: uv run pytest -m jax -n auto

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra test
      - name: Restore benchmark cache
        uses: actions/cache/restore@v4
        with:
          path: .benchmarks
          # Unique key per commit; restore-keys falls back to the most recent
          # cached result for this OS so we always compare against a baseline.
          key: benchmark-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            benchmark-${{ runner.os }}-
      - name: Run benchmark (two-level sech 2π)
        run: |
          # Only add --benchmark-compare-fail when a baseline exists in the
          # cache. On the first run the cache is empty so we just save;
          # subsequent runs compare and fail on >200% mean regression.
          # GitHub runners of the same OS label vary far more than first
          # assumed: the same code measured 140, 225, 232 and 318 ms on this
          # benchmark (up to +127% against a baseline saved from a fast
          # runner), so a 50% gate failed unrelated docs-only PRs. 200% still
          # catches a genuine algorithmic regression (3x slower or worse).
          if find .benchmarks -name "*.json" 2>/dev/null | grep -q .; then
            COMPARE="--benchmark-compare --benchmark-compare-fail=mean:200%"
          else
            COMPARE=""
          fi
          uv run pytest tests/bench_propagation.py::test_bench_two_level_sech_2pi \
            --benchmark-only \
            --benchmark-save=ci \
            $COMPARE
      - name: Save benchmark cache
        # Only update the baseline when the benchmark passes; a regression
        # (failed compare) leaves the previous baseline intact.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .benchmarks
          key: benchmark-${{ runner.os }}-${{ github.sha }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install dependencies
        run: uv sync --extra docs
      - name: Check API pages are up to date
        run: |
          cd docs && uv run quartodoc build
          git diff --exit-code -- api
      - name: Build docs
        # Renders from stored notebook outputs; notebooks are not re-executed.
        run: cd docs && uv run quarto render
