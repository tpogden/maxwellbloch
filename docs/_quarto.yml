project:
  type: website
  output-dir: _site
  resources:
    - CNAME
  render:
    - index.qmd
    - installation.qmd
    - usage/*.ipynb
    - usage/scripts.md
    - examples/index.qmd
    - examples/*.ipynb
    - "!examples/mbs-ladder-rydberg-eit-counter.ipynb"  # draft
    - support/troubleshooting.md
    - release-notes.qmd
    - news/*.qmd
    - api/*.qmd

filters:
  - _filters/pagetitle.lua

website:
  title: "clerq"
  description: "Classical Maxwell fields propagating through open quantum systems"
  site-url: https://clerq.org
  repo-url: https://github.com/tpogden/clerq
  repo-actions: [edit, issue]
  navbar:
    left:
      - {href: index.qmd, text: Home}
      - {href: installation.qmd, text: Install}
      - {href: usage/two-level.ipynb, text: Usage}
      - {href: examples/index.qmd, text: Examples}
      - {href: api/index.qmd, text: API}
      - {href: release-notes.qmd, text: Release Notes}
      - {href: support/troubleshooting.md, text: Support}
    right:
      - {icon: github, href: "https://github.com/tpogden/clerq", aria-label: GitHub}
  sidebar:
    - id: usage
      title: Usage
      style: docked
      contents:
        - usage/two-level.ipynb
        - usage/three-level.ipynb
        - usage/structure.ipynb
        - usage/spectral-analysis.ipynb
        - usage/velocity-classes.ipynb
        - usage/counter-propagating.ipynb
        - usage/b-field.ipynb
        - usage/units.ipynb
        - usage/numerical-stability.ipynb
        - usage/plotting.ipynb
        - usage/built-in-time-functions.ipynb
        - usage/autodiff-recipes.ipynb
        - usage/scripts.md
    - id: examples
      title: Examples
      style: docked
      contents:
        - examples/index.qmd
        - examples/mbs-linear-absorption.ipynb
        - examples/mbs-sit-area-theorem.ipynb
        - examples/mbs-two-photon-echo.ipynb
        - examples/mbs-two-stimulated-echo.ipynb
        - examples/mbs-lambda-eit-slow-light.ipynb
        - examples/mbs-lambda-cpt.ipynb
        - examples/mbs-lambda-adiabatons.ipynb
        - examples/mbs-vee-simultons.ipynb
        - examples/mbs-ladder-weak-pulse-coupling-decay.ipynb
        - examples/mbs-ladder-autler-townes.ipynb
        - examples/mbs-Rb87_5s12_5p12_F11_q1-weak-pulse-decay.ipynb
        - examples/mbs-Rb87_5s12_5p12_F11_q1-sech-2pi.ipynb
        - examples/mbs-Rb87_5s12_5p32_F23_q1-weak-pulse-decay.ipynb
        - examples/autodiff-pulse-design.ipynb
    - id: api
      title: API reference
      style: docked
      contents:
        - api/index.qmd
        - auto: "api/*.qmd"

quartodoc:
  package: clerq
  source_dir: ../src
  dir: api
  parser: google
  title: API reference
  sections:
    - title: Solvers
      desc: Time-domain and spatial-propagation solvers.
      contents:
        - PropagationSolver
        - LindbladSolver
    - title: Differentiable propagation
      desc: Exact gradients through the propagation (needs the `jax` extra).
      contents:
        - autodiff.AutodiffPropagation
        - autodiff.OptimizeResult
        - autodiff.controls.gaussian_basis
        - autodiff.controls.fit_coefficients
        - autodiff.controls.bounded
        - autodiff.controls.unbounded
    - title: Exceptions
      desc: Raised by `PropagationSolver.solve()`.
      contents:
        - exceptions.PropagationInstabilityError
        - exceptions.CounterPropagatingDepletionError
    - title: Systems and fields
      contents:
        - System
        - Field
    - title: Time functions
      contents:
        - t_funcs.square
        - t_funcs.gaussian
        - t_funcs.sech
        - t_funcs.ramp_on
        - t_funcs.ramp_off
        - t_funcs.ramp_onoff
        - t_funcs.ramp_offon
        - t_funcs.sinc
        - t_funcs.intp
    - title: Spectral analysis
      contents:
        - spectral.freq_list
        - spectral.rabi_freq
        - spectral.absorption
        - spectral.dispersion
        - spectral.susceptibility_two_linear_known
        - spectral.absorption_two_linear_known
        - spectral.dispersion_two_linear_known
        - spectral.voigt_two_linear_known
    - title: Hyperfine structure
      contents:
        - hyperfine.Atom1e
        - hyperfine.LevelF
        - hyperfine.LevelMF
    - title: Unit conversions
      desc: From experimental units to clerq's (MHz, µs, cm).
      contents:
        - macro.saturation_intensity
        - macro.intensity_to_rabi_freq
        - macro.rabi_freq_to_intensity
        - macro.gaussian_beam_peak_intensity
        - macro.interaction_strength
        - macro.resonant_optical_depth
        - macro.thermal_width
    - title: Utilities
      contents:
        - utility.maxwell_boltzmann
        - utility.half_max_roots
        - utility.full_width_at_half_max

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    highlight-style: github
    respect-user-color-scheme: true
    include-in-header:
      - _fonts.html
      - _plotly-theme.html
    toc: true
    code-copy: true
    code-overflow: wrap
