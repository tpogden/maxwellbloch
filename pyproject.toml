[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clerq"
version = "0.15.0"
description = "Classical Maxwell fields propagating through open quantum systems: Maxwell's equations coupled to the Lindblad master equation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thomas P Ogden", email = "t@ogden.eu" }]
requires-python = ">=3.10"
dependencies = ["qutip>=5", "tqdm>=4"]

[project.urls]
Homepage = "https://github.com/tpogden/clerq"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov", "pytest-xdist"]
docs = [
    "quartodoc",
    "jupyter",
    "matplotlib",
    "seaborn",
    "plotly>=5.18",
    "kaleido>=0.2",
]
plot = ["plotly>=5.18", "kaleido>=0.2"]
# Automatic differentiation backend (clerq.autodiff). CI tests the lowest (Python 3.10:
# jax 0.6.2, diffrax 0.7.0) and highest supported versions.
jax = ["jax>=0.6.2,<0.12", "diffrax>=0.7.0,<0.8", "optax>=0.2.4"]
dev = ["clerq[test,docs,plot,jax]", "ruff", "twine", "bump-my-version"]

[tool.bumpversion]
current_version = "0.15.0"
commit = true
tag = true
tag_name = "v{new_version}"
commit_args = "--no-verify"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'current_version = "{current_version}"'
replace = 'current_version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.setuptools.packages.find]
where = ["src"]

# bin/ scripts are standalone files rather than entry-point callables.
[tool.setuptools]
script-files = [
    "bin/mbsolve",
    "bin/obsolve",
    "bin/make-mp4-fixed-frame.py",
    "bin/make-mp4-fixed-frame-2-fields.py",
    "bin/make-gif-ffmpeg.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["jax: needs the optional clerq[jax] extra (selected in CI with -m jax)"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501", # line-too-long — many long docstrings/comments; revisit separately
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"] # unused imports OK in test packages

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest-benchmark>=5.2.3",
]
